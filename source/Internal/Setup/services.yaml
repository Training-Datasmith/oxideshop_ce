imports:
  - { resource: Database/services.yaml }
  - { resource: Directory/services.yaml }
  - { resource: Htaccess/services.yaml }
  - { resource: Language/services.yaml }
  - { resource: Validator/services.yaml }
  - { resource: Parameters/services.yaml }
  - { resource: ShopConfiguration/services.yaml }

services:
  _defaults:
    autowire: true

  OxidEsales\EshopCommunity\Internal\Setup\ShopSetupCommand:
    class: OxidEsales\EshopCommunity\Internal\Setup\ShopSetupCommand
    tags:
      - { name: 'console.command', command: 'oe:setup:shop' }

  OxidEsales\EshopCommunity\Internal\Setup\DatabaseResetCommand:
    class: OxidEsales\EshopCommunity\Internal\Setup\DatabaseResetCommand
    tags:
      - { name: 'console.command', command: 'oe:database:reset' }