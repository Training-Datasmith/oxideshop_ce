services:
  _defaults:
    autowire: true

  oxid_esales.common.storage.flock_store_lock_factory:
    class: Symfony\Component\Lock\Lock_Factory
    arguments:
      - '@oxid_esales.common.storage.flock_store'

  oxid_esales.common.storage.flock_store:
    class: Symfony\Component\Lock\Store\Flock_Store

  oxid_esales.common.file_locator:
    class: Symfony\Component\Config\File_Locator

  oxid_esales.symfony.file_system:
    class: Symfony\Component\Filesystem\Filesystem
    public: true

  Symfony\Component\Filesystem\Filesystem:
    alias: oxid_esales.symfony.file_system

  oxid_esales.symfony.mime_types:
    class: Symfony\Component\Mime\Mime_Types

  Oxid_Esales\Eshop_Community\Internal\Framework\Storage\File_Storage_Factory_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Storage\Yaml_File_Storage_Factory
    arguments:
      - '@oxid_esales.common.file_locator'
      - '@oxid_esales.common.storage.flock_store_lock_factory'
      - '@oxid_esales.symfony.file_system'
