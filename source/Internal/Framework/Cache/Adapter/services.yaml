services:
  _defaults:
    autowire: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Cache\Adapter\Tag_Aware_Adapter_Factory_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Cache\Adapter\Filesystem_Tag_Aware_Adapter_Factory

  Symfony\Component\Cache\Adapter\Tag_Aware_Adapter_Interface:
    factory: ['@Oxid_Esales\Eshop_Community\Internal\Framework\Cache\Adapter\Tag_Aware_Adapter_Factory_Interface', 'create']
    arguments: ['@=service("OxidEsales\\EshopCommunity\\Internal\\Transition\\Utility\\ContextInterface").getCurrentShopId()']

  Psr\Cache\Cache_Item_Pool_Interface:
    alias: Symfony\Component\Cache\Adapter\Tag_Aware_Adapter_Interface
    public: true

  Symfony\Contracts\Cache\Tag_Aware_Cache_Interface:
    alias: Symfony\Component\Cache\Adapter\Tag_Aware_Adapter_Interface
    public: true