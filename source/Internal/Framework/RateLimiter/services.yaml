parameters:
  oxid_esales.rate_limiter.enabled: true
  oxid_esales.rate_limiter.limit: 100
  oxid_esales.rate_limiter.interval: 60
  oxid_esales.rate_limiter.policy: 'token_bucket'
  oxid_esales.rate_limiter.excluded_routes: []

services:
  _defaults:
    autowire: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Api_Rate_Limiter_Factory_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Api_Rate_Limiter_Factory
    arguments:
      $limit: '%oxid_esales.rate_limiter.limit%'
      $interval: '%oxid_esales.rate_limiter.interval%'
      $policy: '%oxid_esales.rate_limiter.policy%'

  Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Client_Identifier_Provider_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Client_Identifier_Provider

  Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Api_Rate_Limit_Listener:
    arguments:
      $enabled: '%oxid_esales.rate_limiter.enabled%'
      $excludedRoutes: '%oxid_esales.rate_limiter.excluded_routes%'
    tags:
      - { name: kernel.event_subscriber }

  Oxid_Esales\Eshop_Community\Internal\Framework\Rate_Limiter\Rate_Limit_Headers_Listener:
    tags:
      - { name: kernel.event_subscriber }
