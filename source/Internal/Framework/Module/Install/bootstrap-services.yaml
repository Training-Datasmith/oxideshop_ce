services:
  _defaults:
    autowire: true

  oxid_esales.module.install.service.bootstrap_module_installer:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Bootstrap_Module_Installer
    public: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Module_Files_Installer_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Module_Files_Installer
    arguments:
      $fileSystemService: '@oxid_esales.symfony.file_system'
    public: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Module_Configuration_Installer_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Module_Configuration_Installer
    arguments:
      $context: '@Oxid_Esales\Eshop_Community\Internal\Transition\Utility\Basic_Context_Interface'
    public: true

  oxid_esales.module.install.service.installed_shop_project_configuration_generator:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Install\Service\Project_Configuration_Generator
    arguments:
      $context: '@Oxid_Esales\Eshop_Community\Internal\Transition\Utility\Basic_Context_Interface'
    public: true