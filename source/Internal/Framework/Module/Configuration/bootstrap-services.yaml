services:
  _defaults:
    autowire: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Dependency_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Dependency_Dao

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Configuration_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Configuration_Dao
    arguments:
      Symfony\Component\Config\Definition\Node_Interface: '@oxid_esales.module.configuration.node'

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Chain\Class_Extensions_Chain_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Chain\Class_Extensions_Chain_Dao
    public: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Chain\Template_Extension_Chain_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Chain\Template_Extension_Chain_Dao

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Cache\Module_Configuration_Cache_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Cache\Class_Property_Module_Configuration_Cache

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Shop_Configuration_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Shop_Configuration_Dao
    arguments:
      Symfony\Component\Filesystem\Filesystem: '@oxid_esales.symfony.file_system'
    public: true

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Environment_Configuration_Dao_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Environment_Configuration_Dao
    arguments:
      Symfony\Component\Filesystem\Filesystem: '@oxid_esales.symfony.file_system'
      Symfony\Component\Config\Definition\Node_Interface: '@oxid_esales.module.configuration.node'
      $context: '@Oxid_Esales\Eshop_Community\Internal\Transition\Utility\Basic_Context_Interface'

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Configuration_Extender_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Dao\Module_Environment_Configuration_Extender

  oxid_esales.module.configuration.node:
    class: Symfony\Component\Config\Definition\Node_Interface
    factory: [ '@Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Definition\Tree_Builder_Factory_Interface', 'create' ]

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Definition\Tree_Builder_Factory_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Definition\Tree_Builder_Factory

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration_Data_Mapper_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration_Data_Mapper
    arguments:
      - '@oxid_esales.module.configuration.class_extensions_data_mapper'
      - '@oxid_esales.module.configuration.controllers_data_mapper'
      - '@oxid_esales.module.configuration.events_data_mapper'
      - '@oxid_esales.module.configuration.module_settings_data_mapper'

  oxid_esales.module.configuration.class_extensions_data_mapper:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration\Class_Extensions_Data_Mapper

  oxid_esales.module.configuration.controllers_data_mapper:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration\Controllers_Data_Mapper

  oxid_esales.module.configuration.events_data_mapper:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration\Events_Data_Mapper

  oxid_esales.module.configuration.module_settings_data_mapper:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Data_Mapper\Module_Configuration\Module_Settings_Data_Mapper

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Module_Configuration_Merging_Service_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Module_Configuration_Merging_Service

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Settings_Merging_Service_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Settings_Merging_Service

  Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Module_Class_Extensions_Merging_Service_Interface:
    class: Oxid_Esales\Eshop_Community\Internal\Framework\Module\Configuration\Service\Module_Class_Extensions_Merging_Service
